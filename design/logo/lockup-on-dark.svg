<!-- Mark + wordmark for dark backgrounds. The wordmark sits on the bars' baseline;
     the gap equals one bar + one gap (16). Set in the system UI face, weight 700. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 38" width="236" height="38">
  <rect x="0"  y="16" width="10" height="22" rx="5" fill="#f0846b"/>
  <rect x="16" y="4"  width="10" height="34" rx="5" fill="#e8d35c"/>
  <rect x="32" y="10" width="10" height="28" rx="5" fill="#7bd88f"/>
  <rect x="48" y="0"  width="10" height="38" rx="5" fill="#5b8def"/>
  <text x="74" y="37" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-0.8" fill="#ececf0">ReaMesh</text>
</svg>

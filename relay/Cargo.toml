[package]
name = "reamesh-relay"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
description = "Self-hostable libp2p relay that lets ReaMesh sessions reach each other across NATs"
publish = false

# relay-proto is shared with the core; a member here so its own tests can run from
# this directory, against this lockfile.
[workspace]
members = ["../relay-proto"]

[dependencies]
anstream = "1.0"
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
# Local interface addresses, to find the public IPs the relay code advertises.
if-addrs = "0.15"
# Local time for log lines and key dates.
jiff = "0.2"
# The relay code and auth exchange, shared with ReaMesh itself.
reamesh-relay-proto = { path = "../relay-proto" }
# Checks a downloaded update against the release key.
minisign-verify = "0.2"
libp2p = { version = "0.57.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "relay", "identify", "ping", "autonat", "macros", "request-response", "cbor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Downloads updates; TLS with bundled roots, so it works in a bare container.
ureq = "3"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
toml = "0.9"
# Edits config.toml from the `key` commands without dropping its comments.
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

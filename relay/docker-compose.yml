# ReaMesh relay: `docker compose up -d`, then `docker compose logs` shows the
# relay code. Keys: `docker compose exec relay reamesh-relay key add <label>`.
services:
  relay:
    # The repository root: the build also needs relay-proto/ and proprietary/.
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: reamesh-relay
    restart: unless-stopped
    # Host networking: the relay sees the server's real addresses (for the
    # relay code and IPv6) and UDP needs no port mapping. Without it, map
    # both protocols instead and set public_addrs in config.toml:
    #   ports: ["4001:4001/tcp", "4001:4001/udp"]
    network_mode: host
    volumes:
      - data:/data

volumes:
  data:

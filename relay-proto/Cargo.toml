[package]
name = "reamesh-relay-proto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
description = "The relay code, auth exchange and session list shared by ReaMesh and reamesh-relay"
publish = false

[dependencies]
blake3 = "1.5"
libp2p = { version = "0.57.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"

[dev-dependencies]
libp2p = { version = "0.57.0", default-features = false, features = ["ed25519", "noise"] }

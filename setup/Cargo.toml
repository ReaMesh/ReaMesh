[package]
name = "reamesh-setup"
version = "1.3.0"
description = "ReaMesh Setup for Windows"
authors = ["tiszu"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
publish = false
default-run = "reamesh-setup"

# Its own lockfile and target dir: the setup is built after the app, from the
# finished app binary, and shares no code with it.
[workspace]

[[bin]]
name = "reamesh-setup"
path = "src/main.rs"

# Appends the app's files to a built setup binary (see src/payload.rs).
[[bin]]
name = "pack"
path = "src/bin/pack.rs"

[features]
# Serve the bundled UI instead of the dev server; set for every real build.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The payload: one zstd stream, checked against its blake3 hash before
# anything is written.
zstd = "0.13"
blake3 = "1.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

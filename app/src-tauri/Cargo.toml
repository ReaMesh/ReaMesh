[package]
name = "app"
version = "0.1.0"
description = "ReaMesh companion app"
authors = ["tiszu"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Keep the library name distinct from the binary to avoid Windows linker
# conflicts: https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the native AppKit settings window (src/settings_window.m) on macOS.
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# `reamesh://` invite links: the OS opens the app with the link (registered by
# the installer / the bundle's Info.plist). Single-instance is what makes a
# second launch on Windows hand its argv (the link) to the running app instead
# of opening another window; its `deep-link` feature raises that as the same
# open-url event the plugin fires everywhere else.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# In-app updates (src/updater.rs): checks a signed manifest, downloads in the
# background and installs only when the user clicks restart.
tauri-plugin-updater = "2"
# Restores the main window's position and size, so the restart after an update
# brings the window back where it was.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local WebSocket client for leaving the session before exit (ws://127.0.0.1).
tungstenite = "0.30"
# Version compare for an extension pre-installed from a downloaded update.
semver = "1"
# Device language for the "system" language preference (native menus/dialogs).
sys-locale = "0.3"

# The presence overlay's native behaviour on Windows (src/overlay_panel_win.rs):
# a non-activating topmost window that follows REAPER's and hides when REAPER
# is not in front. macOS does the same job in Objective-C (src/overlay_panel.m),
# compiled by build.rs. Version pinned to the one tao already pulls in, so this
# does not build a second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }


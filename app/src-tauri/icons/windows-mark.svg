<!-- Source for icons/icon.ico; render with `bun run icons:windows`.
   The background plate and inset bars keep the mark legible at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#plate)"/>

  <!-- The mark's own geometry (x = i*16, width 10, heights 22/34/28/38),
       centred on y=0 and scaled to 64% so it sits inside the plate. -->
  <g transform="translate(13.4 32) scale(0.64)">
    <rect x="0"  y="-11" width="10" height="22" rx="5" fill="#f0846b"/>
    <rect x="16" y="-17" width="10" height="34" rx="5" fill="#e8d35c"/>
    <rect x="32" y="-14" width="10" height="28" rx="5" fill="#7bd88f"/>
    <rect x="48" y="-19" width="10" height="38" rx="5" fill="#5b8def"/>
  </g>
</svg>

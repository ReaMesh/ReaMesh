<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <!-- DMG installer background, 660x400 pt (rendered at 2x). Light surface,
       the mark + wordmark up top, one charcoal Lucide chevron-right centered
       between the icons. Icon drop spots are at (165,193) and (495,193),
       icon size 110. -->
  <rect width="660" height="400" fill="#F1F1F7"/>

  <!-- The mark's own geometry (bar 10, gap 6, heights 22/34/28/38,
       bottom-aligned) at 50%, with the wordmark on its baseline. The pair is
       142 wide and centred on x=330. -->
  <g transform="translate(259 47)">
    <g transform="scale(0.5)">
      <rect x="0"  y="16" width="10" height="22" rx="5" fill="#f0846b"/>
      <rect x="16" y="4"  width="10" height="34" rx="5" fill="#e8d35c"/>
      <rect x="32" y="10" width="10" height="28" rx="5" fill="#7bd88f"/>
      <rect x="48" y="0"  width="10" height="38" rx="5" fill="#5b8def"/>
    </g>
    <text x="39" y="18.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="21" font-weight="700" letter-spacing="-0.3" fill="#1C1C1E">ReaMesh</text>
  </g>

  <!-- Lucide chevron-right (m9 18 6-6-6-6) scaled 3x, centered at (330,193) -->
  <path d="M321,175 L339,193 L321,211" fill="none" stroke="#3A3A3C"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

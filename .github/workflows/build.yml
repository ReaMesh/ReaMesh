# Build the extension on Windows and macOS (universal), the Windows installer,
# and an unbundled macOS app; check the Intel half natively on an Intel runner. Run Rust tests serially because they share sockets
# and mDNS. Type-check and test the frontend on both platforms.
name: build
on:
  # Pushes that only touch docs, artwork no build embeds, or other workflows
  # don't build; workflow_dispatch still runs it on demand.
  push:
    paths-ignore:
      - "**.md"
      - LICENSE
      - docs/**
      - proprietary/screenshots/**
      - proprietary/dmg/**
      - .github/ISSUE_TEMPLATE/**
      - .github/dependabot.yml
      - .github/workflows/channel.yml
      - .github/workflows/downloads.yml
      - .github/workflows/licenses.yml
      - .github/workflows/release.yml
      - deny.toml
      - skills-lock.json
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Cargo's downloads and build output, cached apart. A run on main saves
      # both; a release run on a tag can only read main's, and it restores the
      # downloads alone (same key as release.yml), never build output. Bundles
      # stay out: a stale installer must never land in the upload below.
      - name: Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/release/bundle/
          key: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Build Rust staticlib
        run: cargo build --release
        working-directory: rust
      # Serial: the in-process session tests use real (non-sandboxed) sockets
      # and mDNS; run in parallel they steal each other's discovery traffic.
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      - name: Build extension DLL
        run: |
          cmake -S extension -B extension/build
          cmake --build extension/build --config Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper_reamesh-windows-x64
          path: extension/build/Release/reaper_reamesh.dll
      - name: App lint + unit tests
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
        working-directory: app
      # The app bundles the DLL built above, so this has to come after it.
      - name: Build app + installer
        run: bun run tauri build
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReaMesh-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Same cache scheme as windows; the universal folder only holds what
      # lipo and the bundler rebuild every run.
      - name: Rust toolchain
        id: rust
        run: |
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/universal-apple-darwin/
          key: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      # Universal (Apple silicon + Intel), macOS 11+.
      - name: Build extension dylib
        run: ./build.sh --no-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper_reamesh-macos
          path: extension/build/reaper_reamesh.dylib
      - name: App lint + unit tests
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
        working-directory: app
      # Compile check only; the release workflow builds the signed bundle.
      # Universal like the release, so this run warms the release's cache.
      # Pass --no-bundle directly; an extra -- would forward it to Cargo.
      - name: Build app (unbundled)
        run: bun run tauri build --target universal-apple-darwin --no-bundle
        working-directory: app

  # Runs the Intel half of the universal build natively: architectures and
  # minimum macOS, loading the x86_64 extension, the C++ tests and the Rust
  # tests, all as x86_64.
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same cache scheme as the other jobs (see windows).
      - name: Rust toolchain
        id: rust
        run: |
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/
          key: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-target-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Build universal extension
        run: ./build.sh --no-app
      - name: Intel check
        run: tools/check-intel.sh

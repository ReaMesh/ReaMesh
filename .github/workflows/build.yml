# Build the extension on Windows and macOS (universal), the Windows installer,
# and an unbundled macOS app; check the Intel half of that build natively on an
# Intel runner. Type-check and test the frontend on both platforms. The Rust
# tests run in their own job per platform, next to the builds. A first job works
# out which of these a push needs (.github/scripts/ci-scope.sh).
name: build
on:
  # Pushes that only touch docs, artwork no build embeds, or other workflows
  # don't build; workflow_dispatch still runs it on demand. Naming branches keeps
  # tags out: release.yml builds and tests those itself.
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - LICENSE
      - docs/**
      - proprietary/changelog/**
      - proprietary/screenshots/**
      - proprietary/dmg/**
      - .github/ISSUE_TEMPLATE/**
      - .github/dependabot.yml
      - .github/workflows/channel.yml
      - .github/workflows/downloads.yml
      - .github/workflows/licenses.yml
      - .github/workflows/release.yml
      - deny.toml
      - skills-lock.json
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the last successful run of this workflow
    outputs:
      build: ${{ steps.scope.outputs.build }}
      core: ${{ steps.scope.outputs.core }}
      tests: ${{ steps.scope.outputs.tests }}
      relay: ${{ steps.scope.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        run: .github/scripts/ci-scope.sh
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # A release run on a tag restores the downloads alone (same key as
      # release.yml), never build output. Bundles stay out: a stale installer
      # must never land in the upload below.
      - uses: ./.github/actions/cargo-cache-restore
        with:
          registry-prefix: cargo-registry-${{ github.job }}-${{ runner.os }}
          target-prefix: cargo-target-${{ github.job }}-${{ runner.os }}
          lockfile-hash: ${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          target-path: |
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/release/bundle/
      - name: Build Rust staticlib
        run: cargo build --release
        working-directory: rust
      - name: Build extension DLL
        run: |
          cmake -S extension -B extension/build
          cmake --build extension/build --config Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper_reamesh-windows-x64
          path: extension/build/Release/reaper_reamesh.dll
      # tsc + vite run in the app build's beforeBuildCommand below.
      - name: App unit tests
        run: |
          bun install --frozen-lockfile
          bun run test
        working-directory: app
      # The app bundles the DLL built above, so this has to come after it.
      - name: Build app + installer
        run: bun run tauri build
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReaMesh-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
      - uses: ./.github/actions/cargo-cache-save

  macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Same cache scheme as windows; the universal folder only holds what
      # lipo and the bundler rebuild every run.
      - uses: ./.github/actions/cargo-cache-restore
        with:
          registry-prefix: cargo-registry-${{ github.job }}-${{ runner.os }}
          target-prefix: cargo-target-${{ github.job }}-${{ runner.os }}
          lockfile-hash: ${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          target-path: |
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/universal-apple-darwin/
      # Universal (Apple silicon + Intel), macOS 11+.
      - name: Build extension dylib
        run: ./build.sh --no-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper_reamesh-macos
          path: extension/build/reaper_reamesh.dylib
      # What the macos-intel job checks; both paths keep their place in the tree.
      - if: needs.changes.outputs.core == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-for-intel-check
          retention-days: 1
          path: |
            extension/build/reaper_reamesh.dylib
            rust/target/universal-apple-darwin/release/libreamesh.a
      # tsc + vite run in the app build's beforeBuildCommand below.
      - name: App unit tests
        run: |
          bun install --frozen-lockfile
          bun run test
        working-directory: app
      # Compile check only; the release workflow builds the signed bundle.
      # Universal like the release, so this run warms the release's cache.
      # Pass --no-bundle directly; an extra -- would forward it to Cargo.
      - name: Build app (unbundled)
        run: bun run tauri build --target universal-apple-darwin --no-bundle
        working-directory: app
      - uses: ./.github/actions/cargo-cache-save

  # Runs the Intel half of the universal build natively: architectures and
  # minimum macOS, loading the x86_64 extension and the C++ tests, all as
  # x86_64. It checks the binaries the macos job built, the same way a release
  # ships them. Its Rust tests run in the tests job below.
  macos-intel:
    needs: [changes, macos]
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: universal-for-intel-check
      - name: Intel check
        run: tools/check-intel.sh --quick

  # The Rust tests of each platform, natively (the Intel runner covers x86_64).
  # With the core itself unoptimized (profile ci-test), since it is what
  # recompiles every run, and side by side (rust/.config/nextest.toml). nextest
  # comes straight from its release, pinned by hash.
  tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            nextest: x86_64-pc-windows-msvc
            nextest-sha256: e51bdb4b5883df48f335381b287378edb244318fac65ae0adaf6b9e69298246b
          - name: macos
            os: macos-latest
            nextest: universal-apple-darwin
            nextest-sha256: d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd
          - name: macos-intel
            os: macos-15-intel
            nextest: universal-apple-darwin
            nextest-sha256: d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_VERSION: 0.9.151
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same cache scheme as the other jobs (see windows), under its own keys.
      - uses: ./.github/actions/cargo-cache-restore
        with:
          registry-prefix: cargo-registry-tests-${{ matrix.name }}
          target-prefix: cargo-target-nextest-${{ matrix.name }}
          lockfile-hash: ${{ hashFiles('rust/Cargo.lock') }}
          target-path: rust/target/
      - name: Install nextest
        shell: bash
        run: |
          archive="cargo-nextest-$NEXTEST_VERSION-${{ matrix.nextest }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$archive"
          cd "$RUNNER_TEMP"
          echo "${{ matrix.nextest-sha256 }}  nextest.tar.gz" | shasum -a 256 -c -
          # From stdin: tar would take the drive letter of a Windows path for a host.
          tar xzf - -C "${CARGO_HOME:-$HOME/.cargo}/bin" < nextest.tar.gz
      - name: Rust tests
        run: cargo nextest run --cargo-profile ci-test --profile ci
        working-directory: rust
      - uses: ./.github/actions/cargo-cache-save

  # The self-hosted relay (relay/): its own crate and lockfile, Linux only.
  # Also tests relay-proto/, the contract it shares with the core.
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        id: rust
        run: |
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            relay/target/
          key: cargo-relay-${{ steps.rust.outputs.commit }}-${{ hashFiles('relay/Cargo.lock', 'relay-proto/Cargo.toml') }}
          restore-keys: cargo-relay-${{ steps.rust.outputs.commit }}-
      - name: Build
        run: cargo build --release --locked
        working-directory: relay
      - name: Test
        run: cargo test --release --locked -p reamesh-relay -p reamesh-relay-proto
        working-directory: relay
      # Only a debug build takes a test channel and key, so the update path gets
      # its own run.
      - name: Update path test
        run: cargo test --locked -p reamesh-relay --test update
        working-directory: relay
      # On main only, see cargo-cache-save.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            relay/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

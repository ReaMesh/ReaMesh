# Build the extension on Windows and macOS (universal), the Windows installer,
# and an unbundled macOS app; check the Intel half natively on an Intel runner. Run Rust tests serially because they share sockets
# and mDNS. Type-check and test the frontend on both platforms.
name: build
on:
  #disabled for now
  #push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Cargo's downloads and build output. A run on main saves them; a release
      # run on a tag can only read main's, so the keys match between build.yml
      # and release.yml. Bundles stay out: a stale installer must never land in
      # the upload below.
      - name: Rust toolchain
        id: rust
        shell: bash
        run: echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/release/bundle/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Build Rust staticlib
        run: cargo build --release
        working-directory: rust
      # Serial: the in-process session tests use real (non-sandboxed) sockets
      # and mDNS; run in parallel they steal each other's discovery traffic.
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      - name: Build extension DLL
        run: |
          cmake -S extension -B extension/build
          cmake --build extension/build --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: reaper_reamesh-windows-x64
          path: extension/build/Release/reaper_reamesh.dll
      - name: App lint + unit tests
        run: |
          bun install
          bun run build
          bun run test
        working-directory: app
      # The app bundles the DLL built above, so this has to come after it.
      - name: Build app + installer
        run: bun run tauri build
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: ReaMesh-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Same cache scheme as windows; the universal folder only holds what
      # lipo and the bundler rebuild every run.
      - name: Rust toolchain
        id: rust
        run: echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            app/src-tauri/target/
            !app/src-tauri/target/universal-apple-darwin/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      # Universal (Apple silicon + Intel), macOS 11+.
      - name: Build extension dylib
        run: ./build.sh --no-app
      - uses: actions/upload-artifact@v7
        with:
          name: reaper_reamesh-macos
          path: extension/build/reaper_reamesh.dylib
      - name: App lint + unit tests
        run: |
          bun install
          bun run build
          bun run test
        working-directory: app
      # Compile check only; the release workflow builds the signed bundle.
      # Universal like the release, so this run warms the release's cache.
      # Pass --no-bundle directly; an extra -- would forward it to Cargo.
      - name: Build app (unbundled)
        run: bun run tauri build --target universal-apple-darwin --no-bundle
        working-directory: app

  # Runs the Intel half of the universal build natively: architectures and
  # minimum macOS, loading the x86_64 extension, the C++ tests and the Rust
  # tests, all as x86_64.
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      # Same cache scheme as the other jobs (see windows).
      - name: Rust toolchain
        id: rust
        run: echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.commit }}-
      - name: Build universal extension
        run: ./build.sh --no-app
      - name: Intel check
        run: tools/check-intel.sh

# Release: builds the signed app for both platforms (the extension rides
# inside it, and is also published on its own, signed, so a downloaded update
# can install it before the app restarts) plus the macOS installer DMG, and
# publishes them, with the updater manifests, as a draft release of this
# repository. Publishing the draft is what hands it to installed apps
# (channel.yml copies its latest.json into the channel manifests). A version
# with a suffix (1.1.0-beta.1) is drafted as a pre-release, i.e. Beta only;
# a plain one (1.1.0) as a stable release, which reaches Stable and Beta.
#
# Trigger: push a tag `v<version>` matching the version in every manifest
# (bun scripts/set-version.ts), or run it by hand on such a tag.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       the updater key (bun tauri signer generate); its public half is
#       plugins.updater.pubkey. Only the bundling and signing steps see it:
#       the app is compiled first without it (`tauri build --no-bundle`), so
#       no dependency's build script or install hook runs with the key in
#       its environment, then `tauri bundle` packages the finished binary
#       and signs the updater artifacts.
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: …"),
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (contents of the .p8)
#       Developer ID signing + notarization of the macOS app (optional: without
#       them the app is signed ad-hoc and not notarized)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Cargo's downloads only (crates are checksummed against Cargo.lock), the
      # same entry build.yml saves on main. Build output is never restored
      # into a release: it is compiled from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - name: Build Rust staticlib
        run: cargo build --release
        working-directory: rust
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      - name: Build extension DLL
        run: |
          cmake -S extension -B extension/build
          cmake --build extension/build --config Release
      - name: App checks
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
        working-directory: app
      - name: Build the app
        run: bun run tauri build --no-bundle --config src-tauri/tauri.release.conf.json
        working-directory: app
      - name: Bundle the installer + signed updater artifacts
        run: bun run tauri bundle --config src-tauri/tauri.release.conf.json
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The same DLL the installer carries, byte for byte, so the app's install
      # check sees no difference once the update itself is installed.
      - name: Sign the extension for pre-install
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp ../extension/build/Release/reaper_reamesh.dll src-tauri/target/release/bundle/nsis/
          bun run tauri signer sign --app-version "$(bun -p 'require("./package.json").version')" \
            src-tauri/target/release/bundle/nsis/reaper_reamesh.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            app/src-tauri/target/release/bundle/nsis/reaper_reamesh.dll
            app/src-tauri/target/release/bundle/nsis/reaper_reamesh.dll.sig

  macos:
    runs-on: macos-latest
    env:
      # Without the Developer ID secrets the app keeps the ad-hoc signature
      # from tauri.conf.json and is not notarized.
      DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Same cache scheme as windows: downloads only.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - name: Rust tests
        run: cargo test --release -- --test-threads=1
        working-directory: rust
      # Universal (Apple silicon + Intel), macOS 11+.
      - name: Build extension dylib
        run: ./build.sh --no-app
      - name: App checks
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
        working-directory: app
      # Compiled before any signing material is on the machine.
      - name: Build the app
        run: |
          bun run tauri build --target universal-apple-darwin --no-bundle \
            --config src-tauri/tauri.release.conf.json
        working-directory: app
      - name: Import signing certificate
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      # Notarization rejects an unsigned Mach-O anywhere in the bundle, so the
      # dylib the bundle picks up is signed first.
      - name: Sign extension dylib
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" extension/build/reaper_reamesh.dylib
      - name: Bundle, sign + notarize the app and updater artifacts
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ "$DEVELOPER_ID" = true ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            (umask 077; echo "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
            bun run tauri bundle --target universal-apple-darwin \
              --config src-tauri/tauri.release.conf.json \
              --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}"
          else
            # Tauri reads these even when empty; unset, it signs ad-hoc and
            # skips notarization.
            unset APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8
            bun run tauri bundle --target universal-apple-darwin \
              --config src-tauri/tauri.release.conf.json
          fi
      # Taken out of the finished bundle, so it is the copy the app installs.
      - name: Sign the extension for pre-install
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle/macos
          cp "$B/ReaMesh.app/Contents/Resources/reaper_reamesh.dylib" "$B/"
          bun run tauri signer sign --app-version "$(bun -p 'require("./package.json").version')" \
            "$B/reaper_reamesh.dylib"
          # make-dmg.sh clears everything but the .app out of this folder.
          mkdir -p ../release-macos
          cp "$B"/*.app.tar.gz "$B"/*.app.tar.gz.sig "$B"/reaper_reamesh.dylib "$B"/reaper_reamesh.dylib.sig ../release-macos/
      # The signing material is no longer needed; nothing after this signs.
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -f "$RUNNER_TEMP/build.keychain" ] || [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          fi
      # The download for new installs. The image stays unsigned either way: a
      # signed but not notarized image would add a second "Open Anyway" prompt.
      - name: Installer DMG
        working-directory: app
        run: |
          VERSION="$(bun -p 'require("./package.json").version')"
          DMG=src-tauri/target/universal-apple-darwin/release/bundle/dmg/ReaMesh_$VERSION.dmg
          if ! APPLE_SIGNING_IDENTITY= bash scripts/make-dmg.sh; then
            # Finder scripting can fail on a runner; ship a plain image then.
            echo "::warning::styled DMG failed, packaging a plain one"
            S="$(mktemp -d)"
            cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/ReaMesh.app "$S/"
            ln -s /Applications "$S/Applications"
            mkdir -p "$(dirname "$DMG")"
            hdiutil create -volname "ReaMesh Installer" -srcfolder "$S" -fs HFS+ -format ULFO -ov "$DMG"
          fi
          cp "$DMG" ../release-macos/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release-macos/*

  # The macOS build is universal; this runs its Intel half natively on an
  # Intel Mac (binaries, x86_64 load, C++ tests, Rust tests) before anything
  # is published.
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same cache scheme as the other jobs (see windows).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ github.job }}-${{ runner.os }}-
      - name: Build universal extension
        run: ./build.sh --no-app
      - name: Intel check
        run: tools/check-intel.sh

  publish:
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: |
          VERSION="$(jq -r .version app/package.json)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bun app/scripts/release-manifest.ts dist "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
      # A draft: nothing reaches installed apps until it is published by hand.
      # A suffixed version is a Beta (pre-release), a plain one Stable.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          case "$VERSION" in
            *-*) KIND=--prerelease ;;
            *) KIND=--latest ;;
          esac
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "$KIND" \
            --title "ReaMesh $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes

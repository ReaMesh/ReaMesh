language = "C"
include_guard = "REAMESH_FFI_H"
autogen_warning = "/* Generated by cbindgen from rust/src/lib.rs. Do not edit by hand. */"
documentation = true
cpp_compat = true
usize_is_size_t = true

[export]
include = ["Reamesh"]

[export.rename]
"Reamesh" = "ReameshHandle"

[parse]
parse_deps = false

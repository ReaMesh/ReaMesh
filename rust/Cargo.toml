[package]
name = "reamesh"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
description = "Peer-to-peer real-time collaboration core for REAPER (yrs + libp2p)"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.102"
libp2p = { version = "0.57.0", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "gossipsub", "mdns", "macros", "request-response", "cbor", "ping", "relay", "dcutr", "identify"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = "0.30"
yrs = "0.26"
blake3 = "1.5"
zstd = "0.14"
# Memory-hard KDF for the session passphrase token: the per-session salt is
# announced publicly, so a plain fast hash would be brute-forceable offline.
argon2 = "0.6"
# CSPRNG for the per-session auth salt.
getrandom = "0.4"
# AEAD sealing of session-topic gossip for passphrase-protected sessions, so a
# LAN peer without the passphrase can't observe live edits (or lift the session
# token out of a plaintext proposal envelope).
chacha20poly1305 = "0.11"
# Matching every project file name against the project text at once, to
# share only the files a session actually uses (`referenced_files`).
aho-corasick = "1"
# Interface netmasks, so a nearby-session address hint is only dialed when it
# lies in one of our own subnets (`hint_addrs`). Same version libp2p's mDNS
# already pulls in.
if-addrs = "0.15"
# The lobby gossip wrapper hands relayed connections a do-nothing handler
# (`relay::LanOnly`). Already in the tree through libp2p.
either = "1"
# Reading the OS resolver config ourselves, so one unparsable nameserver (a
# zone-scoped `fe80::…%en0` on iPhone hotspots) can't fail every swarm start
# (`dns_config`). Same version libp2p's `dns` feature already pulls in.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config"] }
# The relay code and auth exchange, shared with the relay server (`relay/`).
reamesh-relay-proto = { path = "../relay-proto" }

# Free disk space before a download or fetch (`available_space`; on Windows it
# calls kernel32 directly). Already in the tree through libp2p.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The session list's tests run against the real relay server.
reamesh-relay = { path = "../relay" }
tempfile = "3"

# What CI tests with: dependencies as in a release (Argon2 needs the speed), this
# crate barely optimized, because it is what recompiles on every run. Not level 0:
# libp2p's generics are compiled here, and transfers get ten times slower.
[profile.ci-test]
inherits = "release"
opt-level = 1
codegen-units = 256

[profile.ci-test.package."*"]
opt-level = 3

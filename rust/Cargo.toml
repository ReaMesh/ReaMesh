[package]
name = "reamesh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ReaMesh/ReaMesh"
description = "Peer-to-peer real-time collaboration core for REAPER (yrs + libp2p)"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.102"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "gossipsub", "mdns", "macros", "request-response", "cbor", "ping"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = "0.27"
yrs = "0.26"
blake3 = "1.5"
zstd = "0.13"
# Memory-hard KDF for the session passphrase token: the per-session salt is
# announced publicly, so a plain fast hash would be brute-forceable offline.
argon2 = "0.5"
# CSPRNG for the per-session auth salt.
getrandom = "0.2"
# AEAD sealing of session-topic gossip for passphrase-protected sessions, so a
# LAN peer without the passphrase can't observe live edits (or lift the session
# token out of a plaintext proposal envelope).
chacha20poly1305 = "0.10"
# Matching every project file name against the project text at once, to
# share only the files a session actually uses (`referenced_files`).
aho-corasick = "1"
